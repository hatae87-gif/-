<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="head">
        <h1>FFP 영상 워크플로우</h1>
        <span id="host" class="host"></span>
      </header>

      <!-- 탭 -->
      <nav class="tabs">
        <button class="tab active" data-tab="cut">컷 편집</button>
        <button class="tab" data-tab="caption">자막</button>
        <button class="tab" data-tab="assets">에셋</button>
      </nav>

      <!-- 컷 편집 -->
      <section class="panel" data-panel="cut">
        <p class="hint">
          컷 지점을 타임코드로 적거나 SRT를 붙여넣으면 시퀀스에 <b>마커</b>를 일괄로 찍습니다.
          타임라인에서 마커 기준으로 잘라 편집하세요.
        </p>
        <label>타임코드 목록 <small>(한 줄에 하나, 예: 00:00:12,500 장면전환)</small></label>
        <textarea id="cut-tc" rows="6" placeholder="00:00:03,000 인트로 끝&#10;00:00:11,200 본문 시작&#10;00:01:24,000 마무리"></textarea>
        <div class="row">
          <button id="btn-cut-tc">타임코드 → 마커</button>
          <button id="btn-cut-srt" class="ghost">SRT 붙여넣어 마커</button>
        </div>
        <button id="btn-cut-list" class="ghost wide">현재 시퀀스 마커 보기</button>
      </section>

      <!-- 자막 -->
      <section class="panel hidden" data-panel="caption">
        <p class="hint">대본을 붙여넣으면 읽기 속도에 맞춰 자동으로 타이밍한 SRT를 만듭니다.</p>
        <label>대본 <small>(한 줄 = 한 자막)</small></label>
        <textarea id="cap-text" rows="6" placeholder="안녕하세요, 오늘은&#10;프리미어 연동 플러그인을&#10;소개합니다."></textarea>
        <div class="row">
          <label class="inline">읽기속도(글자/초)
            <input id="cap-cps" type="number" value="14" min="6" max="24" step="1" />
          </label>
          <label class="inline">최소노출(초)
            <input id="cap-min" type="number" value="1.2" min="0.5" max="5" step="0.1" />
          </label>
        </div>
        <div class="row">
          <button id="btn-cap-preview" class="ghost">미리보기</button>
          <button id="btn-cap-save">SRT 저장</button>
        </div>
        <div class="row">
          <button id="btn-cap-track" class="wide">SRT 저장 → 시퀀스에 캡션 추가</button>
        </div>
        <button id="btn-cap-import" class="ghost wide">기존 SRT 파일 → 캡션 트랙</button>
        <pre id="cap-preview" class="preview hidden"></pre>
      </section>

      <!-- 에셋 -->
      <section class="panel hidden" data-panel="assets">
        <p class="hint">여러 파일이나 폴더를 한 번에 임포트하고 빈(bin)으로 정리합니다.</p>
        <label class="inline">새 빈 이름 <small>(비우면 루트로)</small>
          <input id="as-bin" type="text" placeholder="예: 2026_프로젝트A" />
        </label>
        <button id="btn-as-files" class="wide">파일 여러 개 임포트</button>
        <button id="btn-as-folder" class="wide">폴더 → 폴더명 빈으로 임포트</button>
        <button id="btn-as-classify" class="ghost wide">폴더 → 종류별 빈으로 분류 임포트</button>
      </section>

      <!-- 상태/로그 -->
      <footer class="foot">
        <div class="row">
          <button id="btn-diag" class="ghost small">환경 점검</button>
          <button id="btn-clear" class="ghost small">로그 지우기</button>
        </div>
        <pre id="log" class="log"></pre>
      </footer>
    </div>
    <script src="src/main.js"></script>
  </body>
</html>
